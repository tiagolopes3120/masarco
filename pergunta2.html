<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunta 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <div class="progress-bar">
             <div class="progress" style="width: 33.3%;"></div>
        </div>
        <div class="question-container">
            <h2>2. Isso afetou sua rotina em seu dia a dia?</h2>
            
            <div class="option">
                <input type="radio" id="q2-sim" name="pergunta2" value="sim">
                <label for="q2-sim">Sim</label>
            </div>

            <div class="option">
                <input type="radio" id="q2-nao" name="pergunta2" value="nao">
                <label for="q2-nao">Não</label>
            </div>
        </div>

        <div class="navigation-buttons">
            <a href="pergunta1.html" class="btn btn-secondary">Voltar</a>
            <a href="pergunta3.html" class="btn btn-primary">Avançar</a>
        </div>
    </div>

    <script>
        document.querySelectorAll('.option input[type="radio"]').forEach(input => {
            input.addEventListener('change', function() {
                // Remove a classe 'selected' de todas as opções
                document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                // Adiciona a classe 'selected' ao pai do input selecionado
                if(this.checked) {
                    this.parentElement.classList.add('selected');
                }
            });
        });
    </script>

</body>
</html>
